<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            color:#333;
        }

        header{
            background:#0077cc;
            color:white;
            padding:20px;
            text-align:center;
        }

        nav{
            background:#005fa3;
            display:flex;
            justify-content:center;
            gap:20px;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            font-weight:bold;
            transition:.3s;
        }

        nav a:hover{
            color:yellow;
        }

        .container{
            max-width:900px;
            margin:40px auto;
            padding:20px;
            text-align:center;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,.1);
        }

        .links{
            margin-top:25px;
        }

        .links a{
            display:inline-block;
            margin:10px;
            padding:12px 22px;
            background:#0077cc;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .links a:hover{
            background:#005fa3;
        }

        footer{
            background:#333;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:40px;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Website</h1>
    <p>A basic HTML website with useful links</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">
    <div class="card">
        <h2>Useful Websites</h2>
        <p>Click any button below to visit the website.</p>

        <div class="links">
            <a href="https://www.google.com" target="_blank">Google</a>
            <a href="https://www.facebook.com" target="_blank">Facebook</a>
            <a href="https://www.youtube.com" target="_blank">YouTube</a>
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="https://www.wikipedia.org" target="_blank">Wikipedia</a>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 My Simple Website. All Rights Reserved.
</footer>

</body>
</html>
