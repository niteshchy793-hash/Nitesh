<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Manager App</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
}

.app {
    width: 100%;
    max-width: 450px;
    min-height: 100vh;
    margin: auto;
    background: white;
    position: relative;
    padding-bottom: 90px;
}

/* Header */

.header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 30px 20px;
    border-radius: 0 0 25px 25px;
}

.header h1 {
    font-size: 28px;
}

.header p {
    margin-top: 8px;
    opacity: .9;
}

/* Search */

.search {
    padding: 20px;
}

.search input {
    width: 100%;
    padding: 15px;
    border: none;
    background: #f1f3f6;
    border-radius: 12px;
    outline: none;
    font-size: 16px;
}

/* Student list */

.students {
    padding: 0 20px;
}

.student {
    display: flex;
    align-items: center;
    gap: 15px;

    background: #f8f9ff;

    padding: 16px;

    margin-bottom: 12px;

    border-radius: 15px;

    box-shadow: 0 3px 10px rgba(0,0,0,.06);
}

.avatar {
    width: 50px;
    height: 50px;

    background: #4f46e5;
    color: white;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
    font-size: 20px;
}

.student-info {
    flex: 1;
}

.student-info h3 {
    margin-bottom: 5px;
}

.student-info p {
    color: #777;
    font-size: 14px;
}

.delete {
    border: none;
    background: #ef4444;
    color: white;

    padding: 8px 10px;

    border-radius: 7px;

    cursor: pointer;
}

/* Add button */

.add-btn {
    position: fixed;

    bottom: 85px;

    width: 60px;
    height: 60px;

    border-radius: 50%;
    border: none;

    background: #4f46e5;
    color: white;

    font-size: 30px;

    cursor: pointer;

    box-shadow: 0 5px 20px rgba(0,0,0,.25);

    right: max(
        calc((100vw - 450px) / 2 + 20px),
        20px
    );
}

/* Bottom navigation */

.bottom-nav {
    position: fixed;

    bottom: 0;

    width: 100%;
    max-width: 450px;

    height: 70px;

    background: white;

    border-top: 1px solid #ddd;

    display: flex;
    align-items: center;
    justify-content: space-around;
}

.bottom-nav button {
    border: none;
    background: none;

    font-size: 24px;

    cursor: pointer;
}

/* Modal */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.6);

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 1000;
}

.modal-box {
    width: 100%;
    max-width: 400px;

    background: white;

    padding: 25px;

    border-radius: 20px;
}

.modal-box h2 {
    margin-bottom: 20px;
}

.modal-box input {
    width: 100%;

    padding: 14px;

    margin-bottom: 12px;

    border: 1px solid #ddd;

    border-radius: 9px;

    font-size: 16px;
}

.save {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 9px;

    background: #4f46e5;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

.cancel {
    width: 100%;

    padding: 12px;

    margin-top: 10px;

    border: none;

    border-radius: 9px;

    background: #ddd;

    cursor: pointer;
}

.empty {
    text-align: center;
    color: #888;
    padding: 40px 20px;
}

</style>
</head>


<body>

<div class="app">

    <!-- Header -->

    <div class="header">

        <h1>🎓 Student Manager</h1>

        <p>Manage your students easily</p>

    </div>


    <!-- Search -->

    <div class="search">

        <input
            type="text"
            id="search"
            placeholder="🔍 Search student..."
            oninput="searchStudents()"
        >

    </div>


    <!-- Student List -->

    <div
        class="students"
        id="studentList">
    </div>


    <!-- Add Button -->

    <button
        class="add-btn"
        onclick="openModal()">

        +

    </button>


    <!-- Bottom Navigation -->

    <div class="bottom-nav">

        <button onclick="showHome()">
            🏠
        </button>

        <button onclick="openModal()">
            ➕
        </button>

        <button onclick="showInfo()">
            ℹ️
        </button>

    </div>

</div>


<!-- Add Student Modal -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <h2>➕ Add Student</h2>


        <input
            type="text"
            id="studentName"
            placeholder="Student name"
        >


        <input
            type="text"
            id="studentClass"
            placeholder="Class / Course"
        >


        <input
            type="tel"
            id="studentPhone"
            placeholder="Phone number"
        >


        <button
            class="save"
            onclick="addStudent()">

            Save Student

        </button>


        <button
            class="cancel"
            onclick="closeModal()">

            Cancel

        </button>

    </div>

</div>


<script>

/* Get saved students */

let students =
    JSON.parse(
        localStorage.getItem("students")
    ) || [];


/* Display students */

function displayStudents(list = students) {

    const container =
        document.getElementById("studentList");

    container.innerHTML = "";


    if (list.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h3>No students found</h3>
                <p>Press + to add a student.</p>
            </div>
        `;

        return;
    }


    list.forEach(function(student, index) {

        const div =
            document.createElement("div");

        div.className = "student";


        const firstLetter =
            student.name
            .charAt(0)
            .toUpperCase();


        div.innerHTML = `

            <div class="avatar">
                ${escapeHTML(firstLetter)}
            </div>

            <div class="student-info">

                <h3>
                    ${escapeHTML(student.name)}
                </h3>

                <p>
                    ${escapeHTML(student.course)}
                </p>

                <p>
                    📞 ${escapeHTML(student.phone)}
                </p>

            </div>

            <button
                class="delete"
                onclick="deleteStudent(${index})">

                🗑️

            </button>
        `;


        container.appendChild(div);

    });

}


/* Add student */

function addStudent() {

    const name =
        document
        .getElementById("studentName")
        .value
        .trim();


    const course =
        document
        .getElementById("studentClass")
        .value
        .trim();


    const phone =
        document
        .getElementById("studentPhone")
        .value
        .trim();


    if (!name || !course || !phone) {

        alert("Please fill all fields.");

        return;
    }


    students.push({

        name: name,

        course: course,

        phone: phone

    });


    saveData();

    clearForm();

    closeModal();

    displayStudents();

}


/* Delete student */

function deleteStudent(index) {

    if (
        confirm(
            "Are you sure you want to delete this student?"
        )
    ) {

        students.splice(index, 1);

        saveData();

        displayStudents();

    }

}


/* Search */

function searchStudents() {

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const filtered =
        students.filter(function(student) {

            return (

                student.name
                .toLowerCase()
                .includes(query)

                ||

                student.course
                .toLowerCase()
                .includes(query)

                ||

                student.phone
                .includes(query)

            );

        });


    displayStudents(filtered);

}


/* Save data */

function saveData() {

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

}


/* Clear form */

function clearForm() {

    document.getElementById("studentName").value = "";

    document.getElementById("studentClass").value = "";

    document.getElementById("studentPhone").value = "";

}


/* Open modal */

function openModal() {

    document.getElementById("modal").style.display =
        "flex";

}


/* Close modal */

function closeModal() {

    document.getElementById("modal").style.display =
        "none";

}


/* Home */

function showHome() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* Information */

function showInfo() {

    alert(
        "Student Manager App\n\n" +
        "Created using HTML, CSS and JavaScript.\n\n" +
        "Your student data is saved locally on your device."
    );

}


/* Security */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* Start app */

displayStudents();

</script>

</body>
</html>
